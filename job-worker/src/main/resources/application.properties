spring.application.name=job-worker

# run alongside job-api (8080)
server.port=8081

# same DB as job-api so worker can update job status
spring.datasource.url=jdbc:postgresql://localhost:5432/jobsdb
spring.datasource.username=jobs
spring.datasource.password=jobs

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka connection + worker consumer group
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=job-worker-dev
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
